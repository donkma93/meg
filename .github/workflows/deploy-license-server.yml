name: Deploy License Server to cPanel

on:
  push:
    branches: [ main ]
    paths:
      - 'license-server/**'
      - '.github/workflows/deploy-license-server.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-deploy:
    name: 🚀 Sync License Server to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔍 Inspect cPanel Structure & Find Live Laravel Path
        run: |
          python3 - << 'EOF' > cpanel_tree.txt
          import os, ftplib

          server = (os.environ.get('FTP_SERVER') or '').strip()
          if '://' in server:
              server = server.split('://')[1].split('/')[0]
          user = (os.environ.get('FTP_USERNAME') or '').strip()
          pwd = (os.environ.get('FTP_PASSWORD') or '').strip()

          ftp = ftplib.FTP(server, timeout=30)
          ftp.login(user, pwd)
          print(f"FTP root pwd: {ftp.pwd()}")
          
          root_items = ftp.nlst()
          print(f"Root items: {root_items}")

          # Quét tìm tất cả các thư mục có login.blade.php
          def find_files(dir_path, depth=0):
              if depth > 4:
                  return
              try:
                  ftp.cwd(dir_path)
              except Exception:
                  return
              try:
                  items = ftp.nlst()
              except Exception:
                  return
              
              if 'login.blade.php' in items or 'resources' in items:
                  print(f"FOUND candidate at: {dir_path} -> items: {items[:8]}")
              
              for item in items:
                  if item in {'.', '..', '.git', 'node_modules', 'vendor', 'logs', 'mail', 'ssl'}:
                      continue
                  # Kiểm tra xem có phải thư mục không
                  subpath = f"{dir_path}/{item}" if dir_path != "/" else f"/{item}"
                  try:
                      ftp.cwd(subpath)
                      ftp.cwd(dir_path) # nếu cwd thành công thì là thư mục
                      find_files(subpath, depth + 1)
                  except Exception:
                      pass

          find_files("/")
          ftp.quit()
          EOF

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add cpanel_tree.txt
          git commit -m "debug: save cpanel directory tree [skip ci]" || true
          git push origin main || true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_FTP_PASSWORD }}
