name: Deploy License Server to cPanel

on:
  push:
    branches: [ main ]
    paths:
      - 'license-server/**'
      - '.github/workflows/deploy-license-server.yml'
  workflow_dispatch: # Cho phép bấm Run Workflow thủ công trên GitHub

jobs:
  web-deploy:
    name: 🚀 Sync License Server to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # So sánh commit trước và sau để chỉ upload file thay đổi

      - name: 📂 Deploy license-server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: license-server/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false # Không xóa các file có sẵn trên hosting như vendor, storage
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            **/node_modules/**
            storage/logs/*.log
            storage/framework/sessions/**
            storage/framework/cache/**
            storage/framework/views/**
