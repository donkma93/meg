name: Deploy License Server to cPanel

on:
  push:
    branches: [ main ]
    paths:
      - 'license-server/**'
      - '.github/workflows/deploy-license-server.yml'
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Sync License Server to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Check & Diagnose FTP Connection
        run: |
          python3 - << 'EOF'
          import os, ftplib, ssl

          server = (os.environ.get('FTP_SERVER') or '').strip()
          # Loại bỏ tiền tố http://, https://, ftp:// nếu có
          if '://' in server:
              server = server.split('://')[1].split('/')[0]

          user = (os.environ.get('FTP_USERNAME') or '').strip()
          pwd = (os.environ.get('FTP_PASSWORD') or '').strip()

          print(f"Connecting to host: [{server}] with username: [{user}]")

          if not server or not user or not pwd:
              print("❌ ERROR: One or more required secrets (Server, Username, Password) are empty!")
              exit(1)

          try:
              ftp = ftplib.FTP(server, timeout=15)
              print(f"✅ Connected to host. Welcome: {ftp.getwelcome()}")
              ftp.login(user, pwd)
              print(f"✅ Login successful! Current dir: {ftp.pwd()}")
              files = ftp.nlst()
              print(f"✅ Files found in root: {files[:10]}")
              ftp.quit()
          except Exception as e:
              print(f"❌ FTP Diagnostic Error: {type(e).__name__}: {e}")
          EOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_FTP_PASSWORD }}

      - name: 📂 Deploy license-server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_FTP_PASSWORD }}
          local-dir: license-server/
          server-dir: ${{ secrets.FTP_SERVER_DIR || secrets.CPANEL_FTP_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            **/node_modules/**
            storage/logs/*.log
            storage/framework/sessions/**
            storage/framework/cache/**
            storage/framework/views/**
