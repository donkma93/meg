name: Deploy License Server to cPanel

on:
  push:
    branches: [ main ]
    paths:
      - 'license-server/**'
      - '.github/workflows/deploy-license-server.yml'
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Sync License Server to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔍 Inspect cPanel Structure & Find Laravel Path
        run: |
          python3 - << 'EOF'
          import os, ftplib

          server = (os.environ.get('FTP_SERVER') or '').strip()
          if '://' in server:
              server = server.split('://')[1].split('/')[0]
          user = (os.environ.get('FTP_USERNAME') or '').strip()
          pwd = (os.environ.get('FTP_PASSWORD') or '').strip()

          ftp = ftplib.FTP(server, timeout=30)
          ftp.login(user, pwd)
          print(f"FTP root pwd: {ftp.pwd()}")
          
          root_items = ftp.nlst()
          print(f"Root items: {root_items}")

          # Kiểm tra các thư mục tiềm năng để tìm file login.blade.php đang chạy
          candidates = ['', 'public_html', 'license-server', 'public']
          for c in root_items:
              if c not in candidates:
                  candidates.append(c)

          for cand in candidates:
              try:
                  if cand:
                      ftp.cwd('/' + cand if not cand.startswith('/') else cand)
                  else:
                      ftp.cwd('/')
                  items = ftp.nlst()
                  print(f"\n--- Checking path: {ftp.pwd()} ---")
                  print(f"Items: {items[:10]}")
                  
                  # Thử kiểm tra resources/views/admin
                  try:
                      views = ftp.nlst('resources/views/admin/auth')
                      print(f"  👉 Found resources/views/admin/auth in {ftp.pwd()}: {views}")
                  except Exception:
                      pass
                  
                  try:
                      views2 = ftp.nlst('resources/views/admin/licenses')
                      print(f"  👉 Found resources/views/admin/licenses in {ftp.pwd()}: {views2}")
                  except Exception:
                      pass
              except Exception as e:
                  pass

          ftp.quit()
          EOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_FTP_PASSWORD }}
