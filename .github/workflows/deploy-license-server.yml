name: Deploy License Server to cPanel

on:
  push:
    branches: [ main ]
    paths:
      - 'license-server/**'
      - '.github/workflows/deploy-license-server.yml'
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Sync License Server to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔍 Inspect cPanel Structure & Report to Summary
        run: |
          python3 - << 'EOF'
          import os, ftplib

          server = (os.environ.get('FTP_SERVER') or '').strip()
          if '://' in server:
              server = server.split('://')[1].split('/')[0]
          user = (os.environ.get('FTP_USERNAME') or '').strip()
          pwd = (os.environ.get('FTP_PASSWORD') or '').strip()

          lines = []
          try:
              ftp = ftplib.FTP(server, timeout=30)
              ftp.login(user, pwd)
              init_pwd = ftp.pwd()
              lines.append(f"## 📡 FTP Server Information")
              lines.append(f"- **Server**: `{server}`")
              lines.append(f"- **Username**: `{user}`")
              lines.append(f"- **Initial Directory (PWD)**: `{init_pwd}`")
              
              root_items = ftp.nlst()
              lines.append(f"\n### 📁 Files/Folders in initial directory ({init_pwd}):")
              for item in root_items:
                  lines.append(f"- `{item}`")

              # Kiểm tra nếu có public_html
              if 'public_html' in root_items:
                  ftp.cwd('public_html')
                  p_items = ftp.nlst()
                  lines.append(f"\n### 📁 Files/Folders in `public_html/`:")
                  for item in p_items[:30]:
                      lines.append(f"- `{item}`")
                  ftp.cwd(init_pwd)
              
              ftp.quit()
          except Exception as e:
              lines.append(f"❌ Error during FTP inspect: {e}")

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write("\n".join(lines) + "\n")
          EOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_FTP_PASSWORD }}
